name: Bug report
description: Report reproducible behavior in the prototype
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security findings, use SECURITY.md. Do not include secrets or private source."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact steps or a small fixture.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, Git version, Forge commit/tag
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact credentials, personal paths and private source.
